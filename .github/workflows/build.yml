name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Pick iOS simulator (by UDID — robust to runner image changes)
        run: |
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available | grep -m1 -E '\(([0-9A-Fa-f-]{36})\)' | grep -Eo '[0-9A-Fa-f-]{36}')
          if [ -z "$UDID" ]; then echo "No simulator available"; exit 1; fi
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - name: Generate project
        run: xcodegen generate
      - name: Dump Info.plists (diagnostics)
        run: |
          APP="DerivedData-cleangeo/Build/Products/Debug-iphonesimulator/CleanGEO.app"
          xcodebuild build -project CleanGEO.xcodeproj -scheme CleanGEO \
            -destination "id=$SIM_UDID" -derivedDataPath DerivedData-cleangeo \
            CODE_SIGNING_ALLOWED=NO | tail -n 20 || true
          APP="DerivedData-cleangeo/Build/Products/Debug-iphonesimulator/CleanGEO.app"
          echo "--- app exists?"; ls -la "$APP" || true
          echo "--- main Info.plist"; plutil -p "$APP/Info.plist" 2>/dev/null | head -40 || echo "NO PLIST"
          echo "--- appex Info.plists"; for f in "$APP"/PlugIns/*.appex/Info.plist; do echo "== $f"; plutil -p "$f" 2>/dev/null | head -20; done || true
      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test -project CleanGEO.xcodeproj -scheme CleanGEO \
            -destination "id=$SIM_UDID" \
            CODE_SIGNING_ALLOWED=NO | tail -n 60

      - name: Archive (unsigned, both extensions must be embedded)
        run: |
          set -o pipefail
          xcodebuild archive -project CleanGEO.xcodeproj -scheme CleanGEO -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/CleanGEO.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 40
          mkdir -p Payload
          cp -R build/CleanGEO.xcarchive/Products/Applications/CleanGEO.app Payload/
          test -d Payload/CleanGEO.app/PlugIns/BlockerExtension.appex
          test -d Payload/CleanGEO.app/PlugIns/CleanGEOVPN.appex
          zip -qr CleanGEO-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CleanGEO-unsigned
          path: CleanGEO-unsigned.ipa
      - name: Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CleanGEO build ${{ github.run_number }}
          prerelease: true
          files: CleanGEO-unsigned.ipa
