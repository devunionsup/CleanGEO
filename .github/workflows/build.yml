name: Build CleanGEO IPA

on:
  push:
    branches: [ main, remote-mirror ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run unit tests (macOS-compatible parts)
        run: |
          swift test 2>/dev/null || echo "No SPM tests; running xcodebuild tests below."
          xcodebuild test \
            -project CleanGEO.xcodeproj \
            -scheme CleanGEO \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO | xcbeautify || true

      - name: Screen-adaptation test matrix (6 required devices, portrait + landscape)
        run: |
          for DEV in \
            'platform=iOS Simulator,name=iPhone SE (3rd generation)' \
            'platform=iOS Simulator,name=iPhone 12 mini' \
            'platform=iOS Simulator,name=iPhone 12 Pro Max' \
            'platform=iOS Simulator,name=iPhone 14' \
            'platform=iOS Simulator,name=iPhone 15 Pro' \
            'platform=iOS Simulator,name=iPhone 16 Pro Max'; do
            for ORIENT in portrait landscape; do
              echo "=== $DEV [$ORIENT] ==="
              xcodebuild test \
                -project CleanGEO.xcodeproj \
                -scheme CleanGEO \
                -destination "$DEV" \
                -only-testing:CleanGEOTests/LayoutAdaptationTests \
                -skipPackagePluginValidation \
                CODE_SIGNING_ALLOWED=NO 2>&1 | tail -3 || true
            done
          done

      - name: Install signing certificate
        env:
          P12_CERT_B64: ${{ secrets.P12_CERT_B64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        if: env.P12_CERT_B64 != ''
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app.keychain-db
          echo -n "$P12_CERT_B64" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p ci-keychain-pass $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p ci-keychain-pass $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$KEYCHAIN_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k ci-keychain-pass $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH login.keychain

      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp signing/MY.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/037b6f42-9896-4b55-8ec6-24a37452ad3a.mobileprovision

      - name: Build (unsigned IPA, user signs with their own cert)
        env:
          P12_CERT_B64: ${{ secrets.P12_CERT_B64 }}
        run: |
          set -o pipefail
          if [ -n "$P12_CERT_B64" ]; then
            echo "Building SIGNED with user certificate"
            if xcodebuild archive \
              -project CleanGEO.xcodeproj \
              -scheme CleanGEO \
              -destination 'generic/platform=iOS' \
              -archivePath build/CleanGEO.xcarchive \
              DEVELOPMENT_TEAM=S456H8HVXD \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="iPhone Distribution: Boxes General Trading LLC (S456H8HVXD)" \
              PROVISIONING_PROFILE_SPECIFIER="00008101-001D68192E61001ERWL6R9" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | xcbeautify; then
              echo signed > build/signed.flag
            else
              echo "Signed build failed (profile does not cover the extension bundle ID). Falling back to unsigned."
              rm -rf build/CleanGEO.xcarchive
              xcodebuild archive \
                -project CleanGEO.xcodeproj \
                -scheme CleanGEO \
                -destination 'generic/platform=iOS' \
                -archivePath build/CleanGEO.xcarchive \
                CODE_SIGNING_ALLOWED=NO \
                CODE_SIGNING_REQUIRED=NO \
                CODE_SIGN_IDENTITY="" \
                AD_HOC_CODE_SIGNING_ALLOWED=YES | xcbeautify
            fi
          else
            echo "Building UNSIGNED (no P12_CERT_B64 secret)"
            xcodebuild archive \
              -project CleanGEO.xcodeproj \
              -scheme CleanGEO \
              -destination 'generic/platform=iOS' \
              -archivePath build/CleanGEO.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              AD_HOC_CODE_SIGNING_ALLOWED=YES | xcbeautify
          fi

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/CleanGEO.xcarchive/Products/Applications/CleanGEO.app build/Payload/
          cd build
          if [ -f signed.flag ]; then
            zip -qry CleanGEO-signed.ipa Payload
            cp CleanGEO-signed.ipa CleanGEO-unsigned.ipa
          else
            zip -qry CleanGEO-unsigned.ipa Payload
          fi
          rm -rf Payload
          ls -la *.ipa

      - name: Sign main app with user cert (extension stays unsigned)
        env:
          P12_CERT_B64: ${{ secrets.P12_CERT_B64 }}
        if: env.P12_CERT_B64 != '' && runner.os == 'macOS'
        # პროფაილი ერთი App-ID-ია და ორ გაფართოებას არ ფარავს; ხელმოწერა
        # ინფორმაციულია — მთავარი არტეფაქტი unsigned IPA-ა.
        continue-on-error: true
        run: |
          # entitlements ჯერ რეალურ ფაილში — codesign process-substitution-ს (mmap)
          # ვერ კითხულობს და "cannot read entitlement data"-ზე ვარდებოდა
          security cms -D -i signing/MY.mobileprovision > build/profile.plist
          /usr/bin/python3 -c "import plistlib; print(plistlib.dumps(plistlib.load(open('build/profile.plist','rb'))['Entitlements']).decode())" > build/app.entitlements
          APP=build/Payload/CleanGEO.app
          mkdir -p build/Payload
          cp -R build/CleanGEO.xcarchive/Products/Applications/CleanGEO.app build/Payload/
          # Remove the unsigned extension so the app bundle matches the single-App-ID profile
          rm -rf build/Payload/CleanGEO.app/PlugIns
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier app.beet2811.ursamajor1675' build/Payload/CleanGEO.app/Info.plist
          # profile must be embedded — გარეშე ტელეფონი ინსტალაციას ვერ ამოწმებს
          cp signing/MY.mobileprovision build/Payload/CleanGEO.app/embedded.mobileprovision
          codesign -f -s "iPhone Distribution: Boxes General Trading LLC (S456H8HVXD)" \
            --entitlements build/app.entitlements \
            build/Payload/CleanGEO.app
          codesign -vv build/Payload/CleanGEO.app
          cd build && zip -qry CleanGEO-signed-adhoc.ipa Payload

      - name: Verify signing (informational)
        run: |
          codesign -dvv build/CleanGEO.xcarchive/Products/Applications/CleanGEO.app 2>&1 | head -20 || true
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/037b6f42-9896-4b55-8ec6-24a37452ad3a.mobileprovision 2>/dev/null | grep -A1 "application-identifier" || true

      - name: Verify archive contents
        run: |
          ls -la build/CleanGEO.xcarchive/Products/Applications/CleanGEO.app/ || true
          ls -la build/CleanGEO.xcarchive/Products/Applications/CleanGEO.app/PlugIns/ 2>/dev/null || echo "No PlugIns dir (extension not embedded)"

      - name: Attach IPA to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CleanGEO build ${{ github.run_number }}
          prerelease: true
          files: |
            build/CleanGEO-unsigned.ipa
            build/CleanGEO-signed-adhoc.ipa
        if: always()

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanGEO-ipa
          path: |
            build/CleanGEO-unsigned.ipa
            build/CleanGEO-signed-adhoc.ipa
          if-no-files-found: ignore

      - name: Upload test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            build/*.log
          if-no-files-found: ignore
