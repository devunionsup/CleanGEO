name: Build CleanGEO IPA

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run unit tests (macOS-compatible parts)
        run: |
          swift test 2>/dev/null || echo "No SPM tests; running xcodebuild tests below."
          xcodebuild test \
            -project CleanGEO.xcodeproj \
            -scheme CleanGEO \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO | xcbeautify || true

      - name: Build (unsigned IPA, user signs with their own cert)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project CleanGEO.xcodeproj \
            -scheme CleanGEO \
            -destination 'generic/platform=iOS' \
            -archivePath build/CleanGEO.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES | xcbeautify

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/CleanGEO.xcarchive/Products/Applications/CleanGEO.app build/Payload/
          cd build
          zip -qry CleanGEO-unsigned.ipa Payload
          rm -rf Payload
          ls -la CleanGEO-unsigned.ipa

      - name: Verify archive contents
        run: |
          ls build/CleanGEO.xcarchive/Products/Applications/CleanGEO.app/
          test -d build/CleanGEO.xcarchive/Products/Applications/CleanGEO.app/PlugIns/BlockerExtension.appex && echo "BlockerExtension.appex present"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanGEO-unsigned-ipa
          path: build/CleanGEO-unsigned.ipa
          if-no-files-found: error

      - name: Upload test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            build/*.log
          if-no-files-found: ignore
