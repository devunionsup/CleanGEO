name: cleanup-actions
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete workflow runs and github-pages deployments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SELF: ${{ github.run_id }}
        run: |
          set -u
          for i in $(seq 1 80); do
            ids=$(gh api "/repos/$REPO/actions/runs?per_page=100" --jq ".workflow_runs[] | select(.id != $SELF) | .id" || true)
            if [ -z "$ids" ]; then echo "no more runs"; break; fi
            echo "$ids" | while read -r id; do
              [ -z "$id" ] && continue
              gh api -X DELETE "/repos/$REPO/actions/runs/$id" >/dev/null 2>&1 && echo "deleted run $id" || echo "skip run $id"
            done
          done
          echo "--- runs left ---"
          gh api "/repos/$REPO/actions/runs?per_page=1" --jq '.total_count' || true
          echo "--- deployments ---"
          for d in $(gh api "/repos/$REPO/deployments?per_page=100" --jq '.[].id' || true); do
            gh api -X DELETE "/repos/$REPO/deployments/$d" >/dev/null 2>&1 && echo "deleted deployment $d" || echo "skip deployment $d"
          done
          echo "--- artifacts ---"
          for a in $(gh api "/repos/$REPO/actions/artifacts?per_page=100" --jq '.artifacts[].id' || true); do
            gh api -X DELETE "/repos/$REPO/actions/artifacts/$a" >/dev/null 2>&1 && echo "deleted artifact $a" || echo "skip artifact $a"
          done
          echo done
