name: cleanup-deployments
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete github-pages deployment history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          for d in $(gh api "/repos/$REPO/deployments?per_page=100" --jq '.[].id' || true); do
            gh api -X DELETE "/repos/$REPO/deployments/$d" >/dev/null 2>&1 && echo "deleted deployment $d" || echo "skip deployment $d"
          done
          echo "remaining:"
          gh api "/repos/$REPO/deployments?per_page=1" --jq 'length' || true
          echo done
