name: safari-extension
on:
  push:
    paths:
      - "SafariExtension/**"
      - ".github/workflows/safari.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: SafariExtension
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 15.2
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build device app (unsigned)
        run: |
          set -o pipefail
          xcodebuild build -project CleanGEOSafari.xcodeproj -scheme CleanGEO -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath DerivedData-safari \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 60
      - name: Diagnostics (PlugIns and bundle IDs)
        if: always()
        run: |
          APP=DerivedData-safari/Build/Products/Release-iphoneos/CleanGEO.app
          echo "--- app bundle id:"; plutil -extract CFBundleIdentifier raw "$APP/Info.plist" || echo MISSING
          echo "--- PlugIns:"; ls -la "$APP/PlugIns" || echo "NO PlugIns folder"
          for f in "$APP"/PlugIns/*.appex/Info.plist; do echo "== $f"; plutil -extract CFBundleIdentifier raw "$f" || echo MISSING; done
      - name: Package IPA
        run: |
          APP=DerivedData-safari/Build/Products/Release-iphoneos/CleanGEO.app
          test -d "$APP/PlugIns/WebExtension.appex"
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr CleanGEO-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CleanGEO-unsigned
          path: SafariExtension/CleanGEO-unsigned.ipa
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: safari-${{ github.run_number }}
          name: CleanGEO Safari build ${{ github.run_number }}
          prerelease: true
          files: SafariExtension/CleanGEO-unsigned.ipa
