name: CleanGEOSafari
options:
  bundleIdPrefix: DEV.GIORGI.DEV
  deploymentTarget: { iOS: "16.0" }
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  CleanGEO:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: DEV.GIORGI.DEV
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: CleanGEO
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
    dependencies:
      - target: WebExtension
  WebExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: WebExtension/Handler
      - path: WebExtension/Resources
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: DEV.GIORGI.DEV.WebExtension
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: WebExtension/Info.plist
      properties:
        CFBundleDisplayName: CleanGEO
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
          NSExtensionAttributes: {}
schemes:
  CleanGEO:
    build: { targets: { CleanGEO: all } }
